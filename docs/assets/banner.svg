<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d">
  <title id="t">Forma — Gym Management System</title>
  <desc id="d">Banner with a dumbbell icon, the Forma wordmark and a pulse line over a dark teal and indigo gradient.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10141C"/>
      <stop offset="0.55" stop-color="#171D27"/>
      <stop offset="1" stop-color="#1B2236"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#A5B4FC"/>
    </linearGradient>
    <radialGradient id="glowT" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5EEAD4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowI" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A5B4FC" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#A5B4FC" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#303B4A" stroke-width="1" opacity="0.45"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="round"><rect width="1200" height="380" rx="24"/></clipPath>
    <style>
      .sans { font-family: 'Manrope','Inter','Segoe UI',system-ui,-apple-system,sans-serif; }
      .mono { font-family: 'JetBrains Mono','Cascadia Code',Consolas,ui-monospace,monospace; }
      .pulse { stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: draw 4.5s ease-in-out infinite; }
      @keyframes draw { 0% { stroke-dashoffset: 1400; opacity: 0; } 15% { opacity: 1; } 70% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
      .float { animation: bob 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#grid)"/>
    <circle cx="170" cy="190" r="250" fill="url(#glowT)"/>
    <circle cx="1040" cy="70" r="260" fill="url(#glowI)"/>

    <!-- pulse line -->
    <path class="pulse" d="M0 322 H300 L330 322 L352 276 L380 350 L408 296 L428 322 H620 L648 322 L670 262 L700 356 L728 300 L748 322 H1200"
          fill="none" stroke="url(#brand)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M0 322 H1200" stroke="#303B4A" stroke-width="1" opacity="0.6"/>

    <!-- dumbbell icon tile -->
    <g class="float">
      <rect x="86" y="100" width="170" height="170" rx="38" fill="#202936" stroke="#303B4A" stroke-width="2"/>
      <rect x="86" y="100" width="170" height="170" rx="38" fill="none" stroke="url(#brand)" stroke-width="2" opacity="0.55"/>
      <g transform="translate(171 185) rotate(-35)" stroke-linecap="round">
        <line x1="-48" y1="0" x2="48" y2="0" stroke="url(#brand)" stroke-width="10"/>
        <rect x="-64" y="-26" width="18" height="52" rx="6" fill="#5EEAD4"/>
        <rect x="-82" y="-16" width="14" height="32" rx="5" fill="#A5B4FC"/>
        <rect x="46" y="-26" width="18" height="52" rx="6" fill="#5EEAD4"/>
        <rect x="68" y="-16" width="14" height="32" rx="5" fill="#A5B4FC"/>
      </g>
    </g>

    <!-- wordmark -->
    <text x="300" y="196" class="sans" font-size="104" font-weight="800" letter-spacing="-3" fill="url(#brand)">Forma</text>
    <text x="304" y="244" class="sans" font-size="30" font-weight="600" fill="#F1F5F9">Gym Management System</text>
    <text x="304" y="280" class="sans" font-size="19" font-weight="500" fill="#94A3B8">Members · Plans · Payments · Insights — one cold-toned dashboard for the whole gym.</text>

    <!-- tech chips -->
    <g class="mono" font-size="15" font-weight="600">
      <rect x="304" y="30" width="108" height="34" rx="17" fill="#202936" stroke="#5EEAD4" stroke-opacity="0.6"/>
      <text x="358" y="52" text-anchor="middle" fill="#5EEAD4">React 18</text>
      <rect x="424" y="30" width="148" height="34" rx="17" fill="#202936" stroke="#A5B4FC" stroke-opacity="0.6"/>
      <text x="498" y="52" text-anchor="middle" fill="#A5B4FC">TypeScript</text>
      <rect x="584" y="30" width="108" height="34" rx="17" fill="#202936" stroke="#34D399" stroke-opacity="0.6"/>
      <text x="638" y="52" text-anchor="middle" fill="#34D399">FastAPI</text>
      <rect x="704" y="30" width="108" height="34" rx="17" fill="#202936" stroke="#FBBF24" stroke-opacity="0.6"/>
      <text x="758" y="52" text-anchor="middle" fill="#FBBF24">Vite</text>
      <rect x="824" y="30" width="128" height="34" rx="17" fill="#202936" stroke="#F87171" stroke-opacity="0.6"/>
      <text x="888" y="52" text-anchor="middle" fill="#F87171">JSON store</text>
    </g>

    <!-- floating mini dashboard card -->
    <g transform="translate(900 120)">
      <rect width="240" height="150" rx="18" fill="#202936" stroke="#303B4A" stroke-width="1.5"/>
      <text x="20" y="32" class="mono" font-size="12" fill="#64748B" letter-spacing="1.5">ACTIVE MEMBERS</text>
      <text x="20" y="76" class="mono" font-size="40" font-weight="700" fill="#F1F5F9">128</text>
      <text x="108" y="74" class="mono" font-size="14" font-weight="600" fill="#34D399">▲ 12%</text>
      <g fill="#5EEAD4">
        <rect x="20" y="112" width="18" height="22" rx="4" opacity="0.35"/>
        <rect x="46" y="102" width="18" height="32" rx="4" opacity="0.5"/>
        <rect x="72" y="94" width="18" height="40" rx="4" opacity="0.65"/>
        <rect x="98" y="86" width="18" height="48" rx="4" opacity="0.8"/>
        <rect x="124" y="78" width="18" height="56" rx="4"/>
      </g>
      <circle cx="198" cy="112" r="22" fill="none" stroke="#303B4A" stroke-width="8"/>
      <circle cx="198" cy="112" r="22" fill="none" stroke="#A5B4FC" stroke-width="8" stroke-dasharray="97 138" stroke-linecap="round" transform="rotate(-90 198 112)"/>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="378" rx="23" fill="none" stroke="#303B4A" stroke-width="2"/>
</svg>
